[project]
name = "balatro-zero"
version = "0.1.0"
description = "Gumbel expert-iteration (AlphaZero-style) agent for Balatro on the jackdaw simulator"
requires-python = ">=3.12,<3.13"
dependencies = [
    "jackdaw",
    "numpy>=1.24",
    "torch>=2.6",
]

[tool.uv.sources]
jackdaw = { path = "../jackdaw-balatro", editable = true }
torch = [
    { index = "pytorch-cu126", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["balatro_zero"]

[project.scripts]
bzero = "balatro_zero.train:main"
